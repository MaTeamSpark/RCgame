<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape to Kerala — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bain:#CC0000;
    --bg:#0a0a0a;
    --panel:#141416;
    --panel-2:#1c1c20;
    --border:#26262c;
    --border-subtle:#1e1e22;
    --text:#e8e8ec;
    --text-strong:#fff;
    --text-muted:#8a8a92;
    --gold:#e8b73a;
    --silver:#c0c0c0;
    --bronze:#cd7f32;
    --accent-glow:rgba(204,0,0,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(ellipse 800px 400px at 20% 0%, rgba(204,0,0,0.06), transparent 60%),
      radial-gradient(ellipse 600px 300px at 80% 100%, rgba(232,183,58,0.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .logo-ma, .logo-rc {
    height: 46px;
    display: block;
  }
  .logo-ma-wrap {
    background: #fff;
    padding: 8px 12px;
    border-radius: 10px;
  }
  .title-block {
    flex: 1;
    text-align: center;
    min-width: 240px;
  }
  .title-block .sub {
    font-size: 11px;
    letter-spacing: .35em;
    font-weight: 800;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .title-block .brand {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .title-block .brand b { color: var(--bain); font-weight: 800; }
  .title-block h1 {
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 900;
    color: var(--text-strong);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .title-block h1 .accent { color: var(--bain); }
  /* CONTROLS ROW */
  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-strong);
    font: 500 14px/1 inherit;
    padding: 12px 16px 12px 40px;
    border-radius: 999px;
    outline: none;
    transition: all .2s;
  }
  .search-wrap input:focus {
    border-color: var(--bain);
    box-shadow: 0 0 0 3px rgba(204,0,0,0.15);
  }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .6;
  }
  .meta-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .meta-row .refresh-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font: 600 12px/1 inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .2s;
  }
  .meta-row .refresh-btn:hover {
    border-color: var(--bain);
    color: var(--text-strong);
  }
  .meta-row .refresh-btn.loading { pointer-events: none; opacity: .6; }
  .updated {
    font-variant-numeric: tabular-nums;
  }
  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat .label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: .2em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 900;
    color: var(--text-strong);
    font-variant-numeric: tabular-nums;
  }
  .stat .value.accent { color: var(--bain); }
  /* TABLE */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  thead {
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .2em;
    color: var(--gold);
    text-transform: uppercase;
    padding: 14px 16px;
    text-align: left;
    white-space: nowrap;
  }
  th.right { text-align: right; }
  th.center { text-align: center; }
  tbody tr {
    border-bottom: 1px solid var(--border-subtle);
    transition: background .15s;
  }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr.top1 { background: linear-gradient(90deg, rgba(232,183,58,0.10), transparent 60%); }
  tbody tr.top2 { background: linear-gradient(90deg, rgba(192,192,192,0.08), transparent 60%); }
  tbody tr.top3 { background: linear-gradient(90deg, rgba(205,127,50,0.08), transparent 60%); }
  td {
    padding: 14px 16px;
    font-size: 14px;
    color: var(--text);
  }
  td.rank {
    font-weight: 800;
    font-size: 15px;
    color: var(--text-muted);
    width: 60px;
  }
  tr.top1 td.rank, tr.top2 td.rank, tr.top3 td.rank {
    font-size: 22px;
  }
  td.name {
    font-weight: 700;
    color: var(--text-strong);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr.top1 td.name { font-size: 16px; }
  td.score {
    font-weight: 800;
    color: var(--bain);
    text-align: right;
    font-size: 15px;
  }
  tr.top1 td.score { font-size: 20px; color: var(--gold); }
  tr.top2 td.score { font-size: 17px; color: var(--silver); }
  tr.top3 td.score { font-size: 17px; color: var(--bronze); }
  td.stage {
    text-align: center;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 13px;
  }
  td.stage .stage-badge {
    display: inline-block;
    padding: 3px 10px;
    background: rgba(204,0,0,0.08);
    border: 1px solid rgba(204,0,0,0.15);
    border-radius: 999px;
    color: var(--bain);
    font-size: 11px;
    font-weight: 700;
  }
  td.group, td.dept {
    color: var(--text-muted);
    font-size: 13px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* LOADING / EMPTY / ERROR STATES */
  .state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .state .big { font-size: 48px; margin-bottom: 12px; }
  .state h3 { color: var(--text-strong); font-size: 18px; margin-bottom: 6px; font-weight: 700; }
  .state p { font-size: 14px; }
  .spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--bain);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* FOOTER */
  footer {
    text-align: center;
    padding: 24px 0 0;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .05em;
  }
  footer a { color: var(--bain); text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }
  /* MOBILE */
  @media (max-width: 720px) {
    .container { padding: 16px 12px 40px; }
    header { padding: 12px 14px; }
    .logo-ma { height: 34px; }
    .logo-rc { height: 34px; }
    .title-block h1 { font-size: 22px; }
    .title-block .sub { font-size: 10px; letter-spacing: .25em; }
    th, td { padding: 10px 10px; }
    th { font-size: 9px; letter-spacing: .15em; }
    td { font-size: 13px; }
    td.group, td.dept { display: none; }
    th.group, th.dept { display: none; }
    .stat .value { font-size: 18px; }
  }
</style>
</head>

  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyzn9HbW7M9lTGWvR5KBWkotEpVaOKWYGR-UXfpZxKMPrsPoLrMeUGW_WPxz_gb2ZyI/exec";
  let allRows = [];
  let allStats = null;
  let searchTerm = "";

  const $ = (id) => document.getElementById(id);

  function fmtNumber(n) { return Number(n).toLocaleString(); }
  function fmtDate(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      if (isNaN(d)) return String(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    } catch (e) { return String(iso); }
  }
  function fmtRelative(iso) {
    try {
      const d = new Date(iso);
      const secs = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
      if (secs < 60) return "just now";
      if (secs < 3600) return Math.floor(secs/60) + "m ago";
      if (secs < 86400) return Math.floor(secs/3600) + "h ago";
      return Math.floor(secs/86400) + "d ago";
    } catch (e) { return ""; }
  }
  function escape(s) {
    return String(s || "").replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderStats(rows, stats) {
    // KPI cards always show the GLOBAL numbers from the Scores sheet — they do NOT
    // shrink when the user types in the search box (the table below narrows instead).
    if (!stats && rows.length === 0) { $('statsBar').style.display = 'none'; return; }
    $('statsBar').style.display = 'grid';
    if (stats) {
      $('statMatches').textContent  = fmtNumber(stats.totalMatches);
      $('statPlayers').textContent  = fmtNumber(stats.uniquePlayers);
      $('statFinished').textContent = fmtNumber(stats.totalFinished);
      $('statTop').textContent      = fmtNumber(stats.topScore);
    } else {
      // Fallback if the Apps Script hasn't been updated with the new stats block
      $('statMatches').textContent  = fmtNumber(rows.length);
      $('statPlayers').textContent  = fmtNumber(new Set(rows.map(r => (r.name||'').toLowerCase())).size);
      $('statFinished').textContent = fmtNumber(rows.filter(r => r.stage === 4).length);
      $('statTop').textContent      = fmtNumber(Math.max.apply(null, rows.map(r => r.score)));
    }
  }

  function renderTable(rows) {
    const wrap = $('tableWrap');
    if (rows.length === 0) {
      wrap.innerHTML = `
        <div class="state">
          <div class="big">🏁</div>
          <h3>No matching runs</h3>
          <p>${searchTerm ? 'Try a different search term.' : 'Be the first to play — the leaderboard is waiting.'}</p>
        </div>`;
      return;
    }
    const rowHtml = rows.map((r, i) => {
      const rank = r.rank || (i + 1);
      const cls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
      const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
      return `<tr class="${cls}">
        <td class="rank">${medal}</td>
        <td class="name">${escape(r.name)}</td>
        <td class="score">${fmtNumber(r.score)}</td>
        <td class="stage"><span class="stage-badge">Stage ${escape(r.stage)}</span></td>
        <td class="group">${escape(r.group)}</td>
        <td class="dept">${escape(r.department)}</td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th class="right">Score</th>
            <th class="center">Stage</th>
            <th class="group">Team</th>
            <th class="dept">Department</th>
          </tr>
        </thead>
        <tbody>${rowHtml}</tbody>
      </table>`;
  }

  function applyFilter() {
    const t = searchTerm.toLowerCase().trim();
    const filtered = t ? allRows.filter(r =>
      (r.name || '').toLowerCase().includes(t) ||
      (r.group || '').toLowerCase().includes(t) ||
      (r.department || '').toLowerCase().includes(t)
    ) : allRows;
    renderTable(filtered);
    // KPIs stay global (allStats) even when the table is filtered
    renderStats(allRows, allStats);
  }

  async function fetchLeaderboard() {
    $('refreshBtn').classList.add('loading');
    try {
      const res = await fetch(BACKEND_URL + '?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.err || 'Unknown error');
      allRows = data.rows || [];
      allStats = data.stats || null;
      $('updated').textContent = 'Updated ' + fmtRelative(data.updatedAt || new Date().toISOString());
      applyFilter();
    } catch (err) {
      console.error(err);
      $('tableWrap').innerHTML = `
        <div class="state">
          <div class="big">⚠️</div>
          <h3>Couldn't load the leaderboard</h3>
          <p>${escape(String(err.message || err))}</p>
          <p style="margin-top:16px"><button class="refresh-btn" onclick="fetchLeaderboard()">Try again</button></p>
        </div>`;
      $('updated').textContent = 'Failed to load';
    } finally {
      $('refreshBtn').classList.remove('loading');
    }
  }

  $('refreshBtn').addEventListener('click', fetchLeaderboard);
  $('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    applyFilter();
  });

  // Boot + auto-refresh every 45 sec
  fetchLeaderboard();
  setInterval(fetchLeaderboard, 45000);
</script>

</body>
</html>
